# Weekly heads-up: checks that the saved Google sign-in (repository secret CLASPRC_JSON) still works, so an expired
# sign-in is found (GitHub emails you about a failed run) before a deploy needs it — and using it weekly keeps Google
# from expiring it for being unused. Uploads nothing. Run it by hand any time (Actions → Check Google sign-in →
# Run workflow), e.g. right after updating the secret. If it fails, its message says why in plain English.
name: Check Google sign-in

on:
  schedule:
    - cron: '17 13 * * 1'   # Mondays 13:17 UTC (8:17 or 9:17 in New York)
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ask Google whether the sign-in still works (nothing is uploaded)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/clasprc.js --check-only
