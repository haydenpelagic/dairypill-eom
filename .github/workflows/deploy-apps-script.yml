# Uploads the script to Google Apps Script on every push to main that changes it, but ONLY if all tests pass.
# One-time setup: SETUP.md section C (repository secret CLASPRC_JSON).
name: Deploy to Apps Script

on:
  push:
    branches: [main]   # only main goes live; other branches never upload
    paths:
      - 'src/**'
      - 'dist/**'
      - 'appsscript.json'
      - '.clasp.json'
      - 'tools/bundle.js'
      - 'tools/clasprc.js'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch: {}

# One deploy at a time; a newer push waits for the one in progress.
concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run all tests (deploy stops here if any fail)
        run: npm test

      - name: Rebuild dist/ and make sure it matches what was pushed
        run: |
          npm run bundle
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run 'npm run bundle', commit, and push again."
            exit 1
          fi

      # Checks the secret is a sign-in file (from clasp 2 or clasp 3 login) and writes it where the uploader reads it.
      # A bad secret stops here with a plain-English reason; the secret is never printed.
      - name: Load the Google sign-in for clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: node tools/clasprc.js

      - name: Upload to Apps Script
        run: npx --yes @google/clasp@2.4.2 push --force

      - name: Summary
        run: echo "Uploaded commit ${GITHUB_SHA::7} from branch ${GITHUB_REF_NAME} to Apps Script project $(node -p "require('./.clasp.json').scriptId")." >> "$GITHUB_STEP_SUMMARY"
